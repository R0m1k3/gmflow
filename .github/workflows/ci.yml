name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      greenmail:
        image: greenmail/standalone:latest
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled=false
            -Dgreenmail.users=a:mdp@test.local,b:mdp@test.local -Dgreenmail.users.login=email
        ports: ["3143:3143", "3025:3025"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/gmflow_ci
      GMFLOW_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      GMFLOW_TEST_IMAP: localhost:3143
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli
      - name: Base de contrôle des requêtes
        run: |
          sqlx database create
          sqlx migrate run
      - name: .sqlx à jour
        run: SQLX_OFFLINE=false cargo sqlx prepare --workspace --check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - name: Attente de GreenMail
        run: for i in $(seq 1 60); do (echo > /dev/tcp/localhost/3143) 2>/dev/null && break; sleep 1; done
      - run: cargo test --workspace --all-features

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  images:
    # Construit les deux images sans les publier (la publication est dans build.yml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: false
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
