# Essai local : docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Construit les images ici, ajoute GreenMail (serveur mail de test) et publie l'app sur 8080.
# Le worker est construit avec `test-utils` : GMFLOW_IMAP_CLAIR_TEST=1 le fait parler à
# GreenMail en IMAP sans TLS. Les images publiées sur GHCR n'ont pas cette fonction.
services:
  app:
    image: gmflow-app:dev
    build: { context: ., target: app }
    ports: ["8080:8080"]
    environment:
      GMFLOW_URL_PUBLIQUE: http://localhost:8080

  worker:
    image: gmflow-worker:dev
    build:
      context: .
      target: worker
      args: { FEATURES: gmflow-worker/test-utils }
    environment:
      GMFLOW_IMAP_CLAIR_TEST: "1"

  greenmail:
    image: greenmail/standalone:latest
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=a:mdp@test.local,b:mdp@test.local -Dgreenmail.users.login=email
    ports: ["3025:3025", "3143:3143"]
    networks: [interne, sortie]

networks:
  npm:
    external: false
    name: gmflow_npm_dev
