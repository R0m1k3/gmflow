[workspace]
resolver = "2"
members = ["crates/gmflow-core", "crates/gmflow-app", "crates/gmflow-worker"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
gmflow-core = { path = "crates/gmflow-core" }
aes-gcm = "0.11.1"
anyhow = "1.0.104"
apalis = "1.2.0"
apalis-postgres = "1.1.1"
argon2 = "0.6.0"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
axum = "0.8.9"
base64 = "0.23.1"
futures = "0.3"
hex = "0.4.3"
lettre = { version = "0.11.24", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1-rustls", "ring", "webpki-roots"] }
calamine = "0.38.0"
lopdf = "0.42"
pdf-extract = "0.12.1"
quick-xml = "0.42.0"
rust_xlsxwriter = "0.103.0"
mail-parser = "1.0.1"
nix = { version = "0.32.0", features = ["fs"] }
portable-pty = "0.9.0"
rand = "0.10.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "uuid", "time", "json", "derive"] }
strip-ansi-escapes = "0.2"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tower = "0.5"
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tower-sessions = "0.15.0"
tower-sessions-sqlx-store = { version = "0.16.0", features = ["postgres"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
webpki-roots = "1.0.12"
